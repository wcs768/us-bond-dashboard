name: Refresh US Bond Dashboard

on:
  workflow_dispatch:

  schedule:
    - cron: "30 22 * * 1-5"

  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download and prepare dashboard data
        env:
          # Optional: define only if automatic source-link discovery fails.
          KW_DOWNLOAD_URL: ${{ vars.KW_DOWNLOAD_URL }}
          ACM_DOWNLOAD_URL: ${{ vars.ACM_DOWNLOAD_URL }}

          # Required for the CDS panel.
          CDS_API_URL: ${{ secrets.CDS_API_URL }}
          CDS_API_TOKEN: ${{ secrets.CDS_API_TOKEN }}
        run: python scripts/update_data.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
