name: Update public market data

on:
  workflow_dispatch:

  schedule:
    - cron: "30 22 * * 1-5"

permissions:
  contents: write

jobs:
  download-and-save-data:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository files
        uses: actions/checkout@v4

      - name: Download official US Treasury yield-curve data
        shell: bash
        run: |
          set -e

          CURRENT_YEAR=$(date -u +%Y)
          PREVIOUS_YEAR=$((CURRENT_YEAR - 10))

          echo "Downloading US Treasury nominal and real yield curves..."

          download_file () {
            URL="$1"
            OUTPUT="$2"

            curl \
              --http1.1 \
              --fail \
              --location \
              --retry 3 \
              --retry-delay 5 \
              --connect-timeout 30 \
              --max-time 120 \
              --user-agent "Mozilla/5.0" \
              "$URL" \
              --output "$OUTPUT"
          }

          # Nominal Treasury par-yield curve: current and previous calendar year
          download_file \
            "https://home.treasury.gov/resource-center/data-chart-center/interest-rates/daily-treasury-rates.csv/${CURRENT_YEAR}/all?type=daily_treasury_yield_curve&field_tdr_date_value=${CURRENT_YEAR}&page&_format=csv" \
            "/tmp/nominal_current.csv"

          download_file \
            "https://home.treasury.gov/resource-center/data-chart-center/interest-rates/daily-treasury-rates.csv/${PREVIOUS_YEAR}/all?type=daily_treasury_yield_curve&field_tdr_date_value=${PREVIOUS_YEAR}&page&_format=csv" \
            "/tmp/nominal_previous.csv"

          # TIPS / Treasury real par-yield curve: current and previous calendar year
          download_file \
            "https://home.treasury.gov/resource-center/data-chart-center/interest-rates/daily-treasury-rates.csv/${CURRENT_YEAR}/all?type=daily_treasury_real_yield_curve&field_tdr_date_value=${CURRENT_YEAR}&page&_format=csv" \
            "/tmp/real_current.csv"

          download_file \
            "https://home.treasury.gov/resource-center/data-chart-center/interest-rates/daily-treasury-rates.csv/${PREVIOUS_YEAR}/all?type=daily_treasury_real_yield_curve&field_tdr_date_value=${PREVIOUS_YEAR}&page&_format=csv" \
            "/tmp/real_previous.csv"

          echo "Files downloaded successfully:"
          wc -c /tmp/nominal_current.csv /tmp/nominal_previous.csv /tmp/real_current.csv /tmp/real_previous.csv

      - name: Create dashboard data file
        shell: bash
        run: |
          python - <<'PY'
          import csv
          import json
          import os
          from datetime import datetime, timezone

          def number(value):
              value = (value or "").strip().replace(",", "")

              if value in ("", "N/A", "NA", "-"):
                  return None

              try:
                  return float(value)
              except ValueError:
                  return None

          def get_value(row, possible_names):
              """
              Treasury occasionally changes spacing or case in CSV headers.
              This permits multiple possible header labels.
              """
              normalised = {
                  str(key).strip().lower(): value
                  for key, value in row.items()
              }

              for name in possible_names:
                  value = normalised.get(name.lower())

                  if value is not None:
                      return value

              return None

          def read_treasury_csv(file_names, curve_type):
              output = []

              for file_name in file_names:
                  with open(file_name, "r", encoding="utf-8-sig") as file:
                      reader = csv.DictReader(file)

                      for row in reader:
                          date = get_value(row, ["Date", "DATE", "Date (MM/DD/YYYY)"])

                          if not date:
                              continue

                          try:
                              parsed_date = datetime.strptime(date.strip(), "%m/%d/%Y")
                              iso_date = parsed_date.strftime("%Y-%m-%d")
                          except ValueError:
                              continue

                          if curve_type == "nominal":
                              output.append({
                                  "date": iso_date,
                                  "y2": number(get_value(row, ["2 Yr", "2-year", "2 Year"])),
                                  "y5": number(get_value(row, ["5 Yr", "5-year", "5 Year"])),
                                  "y10": number(get_value(row, ["10 Yr", "10-year", "10 Year"])),
                                  "y30": number(get_value(row, ["30 Yr", "30-year", "30 Year"]))
                              })

                          if curve_type == "real":
                              output.append({
                                  "date": iso_date,
                                  "y5": number(get_value(row, ["5 Yr", "5-year", "5 Year"])),
                                  "y10": number(get_value(row, ["10 Yr", "10-year", "10 Year"])),
                                  "y30": number(get_value(row, ["30 Yr", "30-year", "30 Year"]))
                              })

              # Merge duplicate dates and sort them.
              merged = {row["date"]: row for row in output}
              return [merged[date] for date in sorted(merged)]

          ust = read_treasury_csv(
              ["/tmp/nominal_previous.csv", "/tmp/nominal_current.csv"],
              "nominal"
          )

          tips = read_treasury_csv(
              ["/tmp/real_previous.csv", "/tmp/real_current.csv"],
              "real"
          )

          if not ust:
              raise RuntimeError("No nominal Treasury data was extracted.")

          if not tips:
              raise RuntimeError("No TIPS real-yield data was extracted.")

          dashboard = {
              "generated_at_utc": datetime.now(timezone.utc).isoformat(),
              "sources": {
                  "ust_tips": "US Department of the Treasury daily par yield curves",
                  "kim_wright": "Not yet automated",
                  "acm": "Not yet automated",
                  "cds": "Not configured"
              },
              "series": {
                  "ust": ust,
                  "tips": tips,
                  "cds": [],
                  "kw": [],
                  "acm": []
              }
          }

          os.makedirs("data", exist_ok=True)

          with open("data/dashboard.json", "w", encoding="utf-8") as file:
              json.dump(dashboard, file, separators=(",", ":"))

          print(f"Created dashboard.json with {len(ust)} UST and {len(tips)} TIPS records.")
          PY

      - name: Save updated data to repository
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/dashboard.json

          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Update UST and TIPS dashboard data"
            git push
          fi
