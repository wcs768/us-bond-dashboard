name: Update public market data

on:
  workflow_dispatch:

  schedule:
    - cron: "0 6 * * 1-5"

permissions:
  contents: write

jobs:
  download-and-save-data:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository files
        uses: actions/checkout@v4

      - name: Download U.S. sovereign CDS history from Investing.com
        shell: bash
        run: |
          set -euo pipefail
          CDS_END_DATE=$(date -u +%F)
          export CDS_END_DATE

          pip install playwright
          playwright install chromium --with-deps

          python - <<'PY'
          import json
          import os
          import time
          from datetime import datetime, timezone
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          DATA_FILE = Path("data/dashboard.json")
          END_DATE = os.environ["CDS_END_DATE"]
          BASE = "https://api.investing.com/api/financialdata/historical/"
          PARAMS = f"?start-date=2016-01-01&end-date={END_DATE}&time-frame=Daily&add-missing-rows=false"

          URLS = {
              "y2": {
                  "id": "1115803",
                  "url": BASE + "1115803" + PARAMS,
                  "referer": "https://www.investing.com/rates-bonds/united-states-cds-2-years-usd-historical-data",
              },
              "y5": {
                  "id": "1115808",
                  "url": BASE + "1115808" + PARAMS,
                  "referer": "https://www.investing.com/rates-bonds/united-states-cds-5-years-usd-historical-data",
              },
              "y10": {
                  "id": "1115802",
                  "url": BASE + "1115802" + PARAMS,
                  "referer": "https://www.investing.com/rates-bonds/united-states-cds-10-years-usd-historical-data",
              },
          }

          USER_AGENT = (
              "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
              "AppleWebKit/537.36 (KHTML, like Gecko) "
              "Chrome/140.0.0.0 Safari/537.36"
          )

          def as_number(value):
              if value is None or value == "":
                  return None
              try:
                  return float(str(value).replace(",", ""))
              except (TypeError, ValueError):
                  return None

          def normalise_date(value):
              if value is None:
                  return None
              text = str(value).strip()
              for fmt in (
                  "%Y-%m-%d",
                  "%Y-%m-%dT%H:%M:%S",
                  "%Y-%m-%dT%H:%M:%SZ",
                  "%Y-%m-%dT%H:%M:%S.%fZ",
                  "%m/%d/%Y",
              ):
                  try:
                      return datetime.strptime(text[:19], fmt).strftime("%Y-%m-%d")
                  except ValueError:
                      pass
              try:
                  number = float(text)
                  if number > 1_000_000_000_000:
                      number /= 1000
                  return datetime.fromtimestamp(number, tz=timezone.utc).strftime("%Y-%m-%d")
              except (TypeError, ValueError, OverflowError, OSError):
                  return None

          def rows_from_payload(payload):
              if isinstance(payload, dict):
                  candidates = (
                      payload.get("data")
                      or payload.get("items")
                      or payload.get("results")
                      or payload
                  )
              else:
                  candidates = payload
              if not isinstance(candidates, list):
                  raise RuntimeError(
                      "Unexpected Investing.com JSON structure: "
                      f"expected list, got {type(candidates).__name__}; "
                      f"top-level keys={list(payload.keys())[:20] if isinstance(payload, dict) else 'n/a'}"
                  )
              rows = []
              for item in candidates:
                  if isinstance(item, dict):
                      date = (
                          item.get("rowDateTimestamp")
                          or item.get("rowDate")
                          or item.get("date")
                          or item.get("Date")
                          or item.get("timestamp")
                          or item.get("time")
                      )
                      value = (
                          item.get("last_close")
                          if item.get("last_close") is not None
                          else item.get("close")
                      )
                      if value is None:
                          value = (
                              item.get("Close")
                              or item.get("last")
                              or item.get("price")
                              or item.get("value")
                          )
                  elif isinstance(item, list) and len(item) >= 2:
                      date, value = item[0], item[-1]
                  else:
                      continue
                  date = normalise_date(date)
                  value = as_number(value)
                  if date and value is not None:
                      rows.append((date, value))
              return rows

          def fetch_all_cds():
              print("Launching browser and establishing Cloudflare session...")
              with sync_playwright() as p:
                  browser = p.chromium.launch(
                      headless=True,
                      args=[
                          "--disable-blink-features=AutomationControlled",
                          "--no-sandbox",
                          "--disable-setuid-sandbox",
                          "--disable-dev-shm-usage",
                      ],
                  )
                  context = browser.new_context(
                      user_agent=USER_AGENT,
                      viewport={"width": 1920, "height": 1080},
                      locale="en-US",
                      extra_http_headers={"Accept-Language": "en-US,en;q=0.9"},
                  )
                  context.add_init_script("""
                      Object.defineProperty(navigator, 'webdriver', {get: () => undefined});
                      window.chrome = { runtime: {} };
                  """)

                  page = context.new_page()

                  # Visit a real CDS page and wait until it looks ready
                  print("Visiting Investing.com CDS page...")
                  page.goto(
                      "https://www.investing.com/rates-bonds/united-states-cds-5-years-usd-historical-data",
                      wait_until="domcontentloaded",
                      timeout=90000,
                  )

                  # Give Cloudflare time + try to detect a challenge
                  for _ in range(6):
                      title = page.title()
                      content = page.content()[:2000].lower()
                      print(f"  title='{title[:80]}'")
                      if "just a moment" in title.lower() or "attention required" in title.lower() or "cf-browser-verification" in content:
                          print("  Cloudflare challenge detected – waiting...")
                          page.wait_for_timeout(5000)
                          continue
                      # Look for any sign the real page loaded
                      if "cds" in title.lower() or "historical" in title.lower() or "investing" in title.lower():
                          break
                      page.wait_for_timeout(3000)

                  # Final reload after challenge should have cleared
                  page.reload(wait_until="networkidle", timeout=60000)
                  time.sleep(3)
                  print(f"Final page title: '{page.title()}'")

                  combined = {}
                  for field, config in URLS.items():
                      print(f"Fetching CDS {field} from inside the browser context...")

                      # Run the fetch *inside* the page so it uses the real browser environment
                      result = page.evaluate(
                          """async ({url, referer}) => {
                              try {
                                  const resp = await fetch(url, {
                                      method: 'GET',
                                      headers: {
                                          'Accept': 'application/json, text/plain, */*',
                                          'Origin': 'https://www.investing.com',
                                          'Referer': referer,
                                          'domain': 'www',
                                          'domain-id': 'www',
                                      },
                                      credentials: 'include',
                                  });
                                  const text = await resp.text();
                                  return {
                                      status: resp.status,
                                      body: text,
                                  };
                              } catch (e) {
                                  return { status: -1, body: String(e) };
                              }
                          }""",
                          {"url": config["url"], "referer": config["referer"]},
                      )

                      if result["status"] != 200:
                          raise RuntimeError(
                              f"HTTP {result['status']} for {field}: {result['body'][:500]}"
                          )

                      try:
                          payload = json.loads(result["body"])
                      except json.JSONDecodeError as e:
                          raise RuntimeError(
                              f"Invalid JSON for {field}: {result['body'][:400]}"
                          ) from e

                      rows = rows_from_payload(payload)
                      if not rows:
                          sample_keys = []
                          data = payload.get("data") if isinstance(payload, dict) else payload
                          if isinstance(data, list) and data and isinstance(data[0], dict):
                              sample_keys = list(data[0].keys())
                          raise RuntimeError(
                              f"No observations for {field}; "
                              f"sample keys={sample_keys}; "
                              f"message={payload.get('message') if isinstance(payload, dict) else None!r}"
                          )

                      for date, value in rows:
                          combined.setdefault(date, {})[field] = value
                      print(f"  → {len(rows)} observations; latest={max(d for d, _ in rows)}")

                  browser.close()
                  return combined

          # ---- main ----
          combined = fetch_all_cds()

          cds = [
              {
                  "date": date,
                  "y2": values.get("y2"),
                  "y5": values.get("y5"),
                  "y10": values.get("y10"),
              }
              for date, values in sorted(combined.items())
          ]
          if not cds:
              raise RuntimeError("No combined CDS observations were created")

          if DATA_FILE.exists():
              with open(DATA_FILE, "r", encoding="utf-8") as f:
                  dashboard = json.load(f)
          else:
              dashboard = {}

          dashboard.setdefault("sources", {})
          dashboard.setdefault("series", {})
          dashboard["sources"]["cds"] = "Investing.com U.S. sovereign CDS historical data"
          dashboard["series"]["cds"] = cds

          with open(DATA_FILE, "w", encoding="utf-8") as f:
              json.dump(dashboard, f, separators=(",", ":"))

          print(f"Saved {len(cds)} combined CDS dates to {DATA_FILE}")
          print(f"Latest CDS date: {cds[-1]['date']}")
          PY
          
      - name: Download 10 years of official US Treasury yield-curve data
        shell: bash
        run: |
          set -e

          CURRENT_YEAR=$(date -u +%Y)

          # Download an extra calendar year so the dashboard always has
          # a full trailing 10-year history, even during the current year.
          START_YEAR=$((CURRENT_YEAR - 10))

          echo "Downloading Treasury data from ${START_YEAR} through ${CURRENT_YEAR}..."

          download_file () {
            URL="$1"
            OUTPUT="$2"

            curl \
              --http1.1 \
              --fail \
              --location \
              --retry 3 \
              --retry-delay 5 \
              --retry-all-errors \
              --connect-timeout 30 \
              --max-time 180 \
              --user-agent "Mozilla/5.0 US-Bond-Yields-Dashboard" \
              "$URL" \
              --output "$OUTPUT"
          }

          mkdir -p /tmp/treasury-data

          for YEAR in $(seq "$START_YEAR" "$CURRENT_YEAR"); do
            echo "Downloading nominal Treasury curve for ${YEAR}..."

            download_file \
              "https://home.treasury.gov/resource-center/data-chart-center/interest-rates/daily-treasury-rates.csv/${YEAR}/all?type=daily_treasury_yield_curve&field_tdr_date_value=${YEAR}&page&_format=csv" \
              "/tmp/treasury-data/nominal_${YEAR}.csv"

            echo "Downloading TIPS real-yield curve for ${YEAR}..."

            download_file \
              "https://home.treasury.gov/resource-center/data-chart-center/interest-rates/daily-treasury-rates.csv/${YEAR}/all?type=daily_treasury_real_yield_curve&field_tdr_date_value=${YEAR}&page&_format=csv" \
              "/tmp/treasury-data/real_${YEAR}.csv"
          done

          echo "Downloaded files:"
          ls -lh /tmp/treasury-data/

      - name: Create 10-year dashboard data file
        shell: bash
        run: |
          python - <<'PY'
          import csv
          import glob
          import json
          import os
          from datetime import datetime, timezone

          DATA_FILE = "data/dashboard.json"

          def number(value):
              value = (value or "").strip().replace(",", "")

              if value in ("", "N/A", "NA", "-", "."):
                  return None

              try:
                  return float(value)
              except ValueError:
                  return None

          def get_value(row, possible_names):
              normalised = {
                  str(key).strip().lower(): value
                  for key, value in row.items()
              }

              for name in possible_names:
                  if name.lower() in normalised:
                      return normalised[name.lower()]

              return None

          def convert_date(value):
              if not value:
                  return None

              value = value.strip()

              for date_format in ("%m/%d/%Y", "%Y-%m-%d"):
                  try:
                      return datetime.strptime(value, date_format).strftime("%Y-%m-%d")
                  except ValueError:
                      pass

              return None

          def read_curve_files(file_pattern, curve_type):
              observations = []

              for file_name in sorted(glob.glob(file_pattern)):
                  print(f"Reading {file_name}")

                  with open(file_name, "r", encoding="utf-8-sig") as file:
                      reader = csv.DictReader(file)

                      for row in reader:
                          date = convert_date(
                              get_value(row, ["Date", "DATE", "Date (MM/DD/YYYY)"])
                          )

                          if not date:
                              continue

                          if curve_type == "nominal":
                              observations.append({
                                  "date": date,
                                  "y2": number(get_value(row, ["2 Yr", "2-year", "2 Year"])),
                                  "y5": number(get_value(row, ["5 Yr", "5-year", "5 Year"])),
                                  "y10": number(get_value(row, ["10 Yr", "10-year", "10 Year"])),
                                  "y30": number(get_value(row, ["30 Yr", "30-year", "30 Year"]))
                              })

                          elif curve_type == "real":
                              observations.append({
                                  "date": date,
                                  "y5": number(get_value(row, ["5 Yr", "5-year", "5 Year"])),
                                  "y10": number(get_value(row, ["10 Yr", "10-year", "10 Year"])),
                                  "y30": number(get_value(row, ["30 Yr", "30-year", "30 Year"]))
                              })

              # Remove duplicates, then put records in date order.
              unique_records = {
                  item["date"]: item
                  for item in observations
              }

              return [
                  unique_records[date]
                  for date in sorted(unique_records)
              ]

          ust = read_curve_files(
              "/tmp/treasury-data/nominal_*.csv",
              "nominal"
          )

          tips = read_curve_files(
              "/tmp/treasury-data/real_*.csv",
              "real"
          )

          if not ust:
              raise RuntimeError("No nominal Treasury observations were extracted.")

          if not tips:
              raise RuntimeError("No TIPS real-yield observations were extracted.")

          # Read the existing file first. This prevents the public-data
          # workflow from deleting existing CDS, Kim-Wright, or ACM data.
          if os.path.exists(DATA_FILE):
              with open(DATA_FILE, "r", encoding="utf-8") as file:
                  dashboard = json.load(file)
          else:
              dashboard = {}

          dashboard.setdefault("sources", {})
          dashboard.setdefault("series", {})

          dashboard["sources"]["ust_tips"] = (
              "US Department of the Treasury daily par yield curves"
          )

          dashboard["series"]["ust"] = ust
          dashboard["series"]["tips"] = tips

          # Preserve data created by the other workflows.
          dashboard["series"].setdefault("cds", [])
          dashboard["series"].setdefault("kw", [])
          dashboard["series"].setdefault("acm", [])

          dashboard["generated_at_utc"] = datetime.now(timezone.utc).isoformat()

          os.makedirs("data", exist_ok=True)

          with open(DATA_FILE, "w", encoding="utf-8") as file:
              json.dump(dashboard, file, separators=(",", ":"))

          print("")
          print(f"Created dashboard.json with {len(ust)} UST records.")
          print(f"Latest UST observation:  {ust[-1]['date']}")
          print(f"Created dashboard.json with {len(tips)} TIPS records.")
          print(f"Latest TIPS observation: {tips[-1]['date']}")
          print("Kim-Wright / ACM / CDS data, if present, were preserved.")
          PY

      - name: Save updated data to repository
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/dashboard.json

          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Update 10-year Treasury and TIPS dashboard data"
            git push
          fi
