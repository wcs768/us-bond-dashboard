name: Update Public Data

on:
  schedule:
    # Runs automatically every day at 00:00 UTC
    - cron: '0 0 * * *'
  # Allows manually triggering the workflow from the Actions tab
  workflow_dispatch:
  # Triggers when changes are pushed to the main branch
  push:
    branches:
      - main

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Fetch and Update Dashboard Data
        run: |
          python -c "
          import urllib.request
          import json
          import os

          # Ensure target directory exists
          os.makedirs('data', exist_ok=True)
          filepath = 'data/dashboard.json'

          # Load existing dataset if available
          if os.path.exists(filepath):
              try:
                  with open(filepath, 'r') as f:
                      data = json.load(f)
              except Exception:
                  data = {}
          else:
              data = {}

          headers = {'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)'}

          # --- Fetch US Sovereign CDS Series ---
          cds_ids = {
              'cds_2y': '1115803',
              'cds_5y': '1115808',
              'cds_10y': '1115802'
          }
          cds_data = {}

          for key, series_id in cds_ids.items():
              url = f'https://api.investing.com/api/financialdata/historical/{series_id}?time-frame=Daily'
              req = urllib.request.Request(url, headers=headers)
              try:
                  with urllib.request.urlopen(req) as response:
                      raw = json.loads(response.read().decode())
                      series = [{'date': item['rowDate'], 'val': item['last_close']} for item in raw.get('data', [])]
                      cds_data[key] = series
              except Exception as e:
                  print(f'Warning: Could not fetch {key}: {e}')

          # Update the primary data object with CDS series
          data['cds'] = cds_data

          # Save updated payload
          with open(filepath, 'w') as f:
              json.dump(data, f, indent=2)

          print('Successfully updated dashboard.json')
          "

      - name: Commit and Push Updated Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/dashboard.json
          
          # Only commit and push if changes are detected
          if git diff --quiet && git diff --staged --quiet; then
            echo "No data updates to commit."
          else
            git commit -m "auto: daily public data update [skip ci]"
            git push
          fi
