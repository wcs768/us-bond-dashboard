name: Update Kim-Wright and ACM model yields

on:
  workflow_dispatch:

  # Run after the UST/TIPS workflow completes successfully.
  workflow_run:
    workflows: ["Update public market data"]
    types:
      - completed

  # Independent weekly backup refresh: Monday, 19:00 UTC.
  schedule:
    - cron: "0 19 * * 1"

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-model-data:
    # Do not run after a failed UST/TIPS workflow.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download repository files
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install data-processing packages
        run: |
          pip install pandas openpyxl xlrd

      - name: Download Kim-Wright and ACM daily model data
        shell: bash
        run: |
          python - <<'PY'
          import io
          import json
          import re
          import time
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          import pandas as pd


          DATA_FILE = Path("data/dashboard.json")

          KW_CSV_URL = (
              "https://www.federalreserve.gov/data/"
              "yield-curve-tables/feds200533.csv"
          )

          ACM_XLSX_URL = (
              "https://www.newyorkfed.org/medialibrary/media/"
              "research/data_indicators/ACMTermPremium.xlsx"
          )

          USER_AGENT = "Mozilla/5.0 US-Bond-Yields-Dashboard"


          def download(url, attempts=4):
              """
              Download a source file with retries.
              """
              last_error = None

              for attempt in range(1, attempts + 1):
                  try:
                      request = urllib.request.Request(
                          url,
                          headers={"User-Agent": USER_AGENT}
                      )

                      with urllib.request.urlopen(
                          request,
                          timeout=180
                      ) as response:
                          return response.read()

                  except Exception as error:
                      last_error = error

                      print(
                          f"Download attempt {attempt}/{attempts} failed: {url}"
                      )
                      print(f"Reason: {error}")

                      if attempt < attempts:
                          time.sleep(attempt * 10)

              raise RuntimeError(
                  f"Could not download source after {attempts} attempts: {url}. "
                  f"Last error: {last_error}"
              )


          def normalise_column(value):
              return re.sub(
                  r"[^a-z0-9]",
                  "",
                  str(value).strip().lower()
              )


          def as_number(value):
              """
              Convert source values to floats, retaining missing values as None.
              """
              try:
                  if pd.isna(value):
                      return None

                  text = str(value).strip().replace(",", "")

                  if text in ("", ".", "N/A", "NA", "nan", "None"):
                      return None

                  return float(text)

              except (TypeError, ValueError):
                  return None


          def parse_kw_dates(values):
              """
              Kim-Wright CSV dates are normally DD-MM-YYYY.

              The fallback formats make this resilient if the Board changes
              the date format in a later file release.
              """
              text = values.astype(str).str.strip()

              parsed = pd.to_datetime(
                  text,
                  format="%d-%m-%Y",
                  errors="coerce"
              )

              missing = parsed.isna()

              if missing.any():
                  parsed.loc[missing] = pd.to_datetime(
                      text.loc[missing],
                      format="%Y-%m-%d",
                      errors="coerce"
                  )

              missing = parsed.isna()

              if missing.any():
                  parsed.loc[missing] = pd.to_datetime(
                      text.loc[missing],
                      format="%m/%d/%Y",
                      errors="coerce"
                  )

              return parsed


          def parse_acm_date(value):
              """
              Parse Excel date cells from the ACM Daily worksheet.
              """
              if pd.isna(value):
                  return None

              # Excel serial date, if applicable.
              if isinstance(value, (int, float)) and not isinstance(value, bool):
                  date = pd.to_datetime(
                      value,
                      unit="D",
                      origin="1899-12-30",
                      errors="coerce"
                  )
              else:
                  date = pd.to_datetime(value, errors="coerce")

              if pd.isna(date):
                  return None

              return date.strftime("%Y-%m-%d")


          def load_existing_dashboard():
              """
              Preserve UST, TIPS and CDS information created by other workflows.
              """
              if DATA_FILE.exists():
                  with open(DATA_FILE, "r", encoding="utf-8") as file:
                      dashboard = json.load(file)
              else:
                  dashboard = {}

              dashboard.setdefault("sources", {})
              dashboard.setdefault("series", {})

              dashboard["series"].setdefault("ust", [])
              dashboard["series"].setdefault("tips", [])
              dashboard["series"].setdefault("cds", [])
              dashboard["series"].setdefault("kw", [])
              dashboard["series"].setdefault("acm", [])

              return dashboard


          def get_kw_data():
              """
              Download and parse the FULL daily Kim-Wright CSV.

              Required fields:
              - THREEFY0200.B / 0500 / 1000: fitted zero-coupon yields
              - THREEFYTP0200.B / 0500 / 1000: term premiums
              """
              print(f"Downloading Kim-Wright daily CSV: {KW_CSV_URL}")

              csv_bytes = download(KW_CSV_URL)

              # The Fed CSV contains introductory metadata rows before the
              # actual header row beginning with Date. Find the true header
              # before passing the remaining file to pandas.
              csv_text = csv_bytes.decode(
                  "utf-8-sig",
                  errors="replace"
              )

              csv_lines = csv_text.splitlines()

              header_index = next(
                  (
                      index
                      for index, line in enumerate(csv_lines)
                      if (
                          line.strip().lower().startswith("date,")
                          and "THREEFY0200.B" in line
                      )
                  ),
                  None
              )

              if header_index is None:
                  raise RuntimeError(
                      "Could not find the Date header in the Kim-Wright CSV. "
                      f"First 10 lines: {csv_lines[:10]}"
                  )

              print(
                  f"Kim-Wright CSV header found on source line "
                  f"{header_index + 1}"
              )

              # Read only from the actual Date header onwards.
              frame = pd.read_csv(
                  io.StringIO("\n".join(csv_lines[header_index:])),
                  sep=",",
                  encoding="utf-8"
              )

              frame.columns = [
                  str(column).strip()
                  for column in frame.columns
              ]

              print(f"Kim-Wright CSV columns: {list(frame.columns)}")
              print(f"Kim-Wright CSV raw rows: {len(frame)}")

              date_column = next(
                  (
                      column
                      for column in frame.columns
                      if normalise_column(column) == "date"
                  ),
                  None
              )

              required_columns = [
                  "THREEFY0200.B",
                  "THREEFY0500.B",
                  "THREEFY1000.B",
                  "THREEFYTP0200.B",
                  "THREEFYTP0500.B",
                  "THREEFYTP1000.B"
              ]

              if date_column is None:
                  raise RuntimeError(
                      "Kim-Wright CSV has no Date column. "
                      f"Columns found: {list(frame.columns)}"
                  )

              missing_columns = [
                  column
                  for column in required_columns
                  if column not in frame.columns
              ]

              if missing_columns:
                  raise RuntimeError(
                      "Kim-Wright CSV is missing required columns: "
                      f"{missing_columns}"
                  )

              frame["_parsed_date"] = parse_kw_dates(frame[date_column])

              rows = []

              for _, record in frame.iterrows():
                  date = record["_parsed_date"]

                  if pd.isna(date):
                      continue

                  y2 = as_number(record["THREEFY0200.B"])
                  y5 = as_number(record["THREEFY0500.B"])
                  y10 = as_number(record["THREEFY1000.B"])

                  tp2 = as_number(record["THREEFYTP0200.B"])
                  tp5 = as_number(record["THREEFYTP0500.B"])
                  tp10 = as_number(record["THREEFYTP1000.B"])

                  rows.append({
                      "date": date.strftime("%Y-%m-%d"),

                      "y2": y2,
                      "y5": y5,
                      "y10": y10,

                      "tp2": tp2,
                      "tp5": tp5,
                      "tp10": tp10,

                      "er2": y2 - tp2 if y2 is not None and tp2 is not None else None,
                      "er5": y5 - tp5 if y5 is not None and tp5 is not None else None,
                      "er10": y10 - tp10 if y10 is not None and tp10 is not None else None
                  })

              # One observation per date, sorted from oldest to newest.
              merged = {
                  row["date"]: row
                  for row in rows
              }

              result = [
                  merged[date]
                  for date in sorted(merged)
              ]

              # Kim-Wright daily data begin in 1990, so a full extraction
              # should have many thousands of business-day observations.
              if len(result) < 5000:
                  raise RuntimeError(
                      f"Kim-Wright extraction produced only {len(result)} records. "
                      "Expected thousands of daily records. "
                      "Existing dashboard data was not overwritten."
                  )

              latest_year = result[-1]["date"][:4]

              current_year_records = [
                  row
                  for row in result
                  if row["date"].startswith(latest_year)
              ]

              print(
                  f"Kim-Wright DAILY records extracted: {len(result)}; "
                  f"first: {result[0]['date']}; "
                  f"latest: {result[-1]['date']}; "
                  f"latest-year records: {len(current_year_records)}"
              )

              return result


          def get_acm_data():
              """
              Download the official NY Fed ACM workbook and explicitly use
              the 'ACM Daily' worksheet.

              The NY Fed file can be served either as:
              - XLSX (ZIP container: starts with PK), or
              - legacy XLS (OLE container: starts with D0 CF 11 E0).

              This function supports both file formats and will give a clear
              error if the server returns an HTML page instead of a workbook.
              """
              acm_urls = [
                  (
                      "https://www.newyorkfed.org/medialibrary/media/"
                      "research/data_indicators/ACMTermPremium.xlsx"
                  ),
                  (
                      "https://www.newyorkfed.org/medialibrary/media/"
                      "research/data_indicators/ACMTermPremium.xls"
                  )
              ]

              workbook_bytes = None
              workbook_engine = None
              workbook_url = None
              invalid_responses = []

              for url in acm_urls:
                  print(f"Trying ACM workbook: {url}")

                  try:
                      candidate = download(url)

                  except Exception as error:
                      print(f"ACM download failed for {url}: {error}")
                      continue

                  # Modern .xlsx files are ZIP containers.
                  if candidate[:2] == b"PK":
                      workbook_bytes = candidate
                      workbook_engine = "openpyxl"
                      workbook_url = url

                      print("ACM file type detected: XLSX")
                      break

                  # Legacy .xls files are OLE Compound Documents.
                  if candidate[:8] == b"\xd0\xcf\x11\xe0\xa1\xb1\x1a\xe1":
                      workbook_bytes = candidate
                      workbook_engine = "xlrd"
                      workbook_url = url

                      print("ACM file type detected: XLS")
                      break

                  preview = candidate[:300].decode(
                      "utf-8",
                      errors="replace"
                  ).replace("\n", " ")

                  invalid_responses.append(
                      f"URL: {url}; first bytes: {preview}"
                  )

                  print(
                      "Downloaded ACM response is not an Excel workbook. "
                      f"Preview: {preview}"
                  )

              if workbook_bytes is None:
                  raise RuntimeError(
                      "Could not obtain a valid ACM Excel workbook. "
                      "The NY Fed server may have returned HTML instead. "
                      + " | ".join(invalid_responses)
                  )

              print(
                  f"Opening ACM workbook from {workbook_url} "
                  f"using {workbook_engine}"
              )

              excel = pd.ExcelFile(
                  io.BytesIO(workbook_bytes),
                  engine=workbook_engine
              )

              print(f"ACM workbook worksheets: {excel.sheet_names}")

              # Explicitly select ACM Daily, never ACM Monthly.
              daily_sheet = next(
                  (
                      sheet
                      for sheet in excel.sheet_names
                      if normalise_column(sheet) == "acmdaily"
                  ),
                  None
              )

              if daily_sheet is None:
                  raise RuntimeError(
                      "Cannot find the 'ACM Daily' worksheet. "
                      f"Available worksheets: {excel.sheet_names}"
                  )

              print(f"Using ACM daily worksheet: {daily_sheet}")

              # Read raw worksheet first because the actual header may not
              # be the first worksheet row.
              raw = pd.read_excel(
                  excel,
                  sheet_name=daily_sheet,
                  header=None
              )

              print(f"ACM Daily raw rows: {len(raw)}")

              header_row = None

              required_headers = {
                  "date",
                  "acmy02",
                  "acmy05",
                  "acmy10",
                  "acmtp02",
                  "acmtp05",
                  "acmtp10"
              }

              for row_number in range(min(40, len(raw))):
                  candidate_headers = [
                      str(value).strip()
                      for value in raw.iloc[row_number].tolist()
                  ]

                  normalised_headers = {
                      normalise_column(value)
                      for value in candidate_headers
                  }

                  if required_headers.issubset(normalised_headers):
                      header_row = row_number
                      break

              if header_row is None:
                  raise RuntimeError(
                      "Could not find Date, ACMY02/05/10 and "
                      "ACMTP02/05/10 headers in the ACM Daily worksheet."
                  )

              print(f"ACM Daily header row: {header_row}")

              frame = raw.iloc[header_row + 1:].copy()

              frame.columns = [
                  str(value).strip()
                  for value in raw.iloc[header_row].tolist()
              ]

              frame = frame.dropna(how="all")

              def find_column(code):
                  for column in frame.columns:
                      if normalise_column(column) == code:
                          return column

                  raise RuntimeError(
                      f"ACM Daily worksheet does not contain {code}. "
                      f"Columns found: {list(frame.columns)}"
                  )

              date_column = find_column("date")

              y2_column = find_column("acmy02")
              y5_column = find_column("acmy05")
              y10_column = find_column("acmy10")

              tp2_column = find_column("acmtp02")
              tp5_column = find_column("acmtp05")
              tp10_column = find_column("acmtp10")

              rows = []

              for _, record in frame.iterrows():
                  date = parse_acm_date(record[date_column])

                  if date is None:
                      continue

                  y2 = as_number(record[y2_column])
                  y5 = as_number(record[y5_column])
                  y10 = as_number(record[y10_column])

                  tp2 = as_number(record[tp2_column])
                  tp5 = as_number(record[tp5_column])
                  tp10 = as_number(record[tp10_column])

                  rows.append({
                      "date": date,

                      "y2": y2,
                      "y5": y5,
                      "y10": y10,

                      "tp2": tp2,
                      "tp5": tp5,
                      "tp10": tp10,

                      "er2": y2 - tp2 if y2 is not None and tp2 is not None else None,
                      "er5": y5 - tp5 if y5 is not None and tp5 is not None else None,
                      "er10": y10 - tp10 if y10 is not None and tp10 is not None else None
                  })

              # Keep one observation per calendar day, ordered oldest first.
              merged = {
                  row["date"]: row
                  for row in rows
              }

              result = [
                  merged[date]
                  for date in sorted(merged)
              ]

              if len(result) < 5000:
                  raise RuntimeError(
                      f"ACM Daily extraction produced only {len(result)} records. "
                      "Expected thousands of daily records."
                  )

              print(
                  f"ACM DAILY records extracted: {len(result)}; "
                  f"first: {result[0]['date']}; "
                  f"latest: {result[-1]['date']}"
              )

              return result


          # Load existing UST, TIPS and CDS series first.
          dashboard = load_existing_dashboard()

          # Replace Kim-Wright only when the complete daily extraction succeeds.
          kw = get_kw_data()

          dashboard["series"]["kw"] = kw
          dashboard["sources"]["kim_wright"] = (
              "Federal Reserve Board Kim-Wright Three-Factor "
              "Nominal Term Structure Model, daily CSV"
          )

          print(
              f"Saved Kim-Wright DAILY series: {len(kw)} records; "
              f"latest: {kw[-1]['date']}"
          )

          # Replace ACM only when the ACM Daily worksheet extraction succeeds.
          acm = get_acm_data()

          dashboard["series"]["acm"] = acm
          dashboard["sources"]["acm"] = (
              "Federal Reserve Bank of New York ACM Daily Term Premia data"
          )

          print(
              f"Saved ACM DAILY series: {len(acm)} records; "
              f"latest: {acm[-1]['date']}"
          )

          dashboard["generated_at_utc"] = datetime.now(
              timezone.utc
          ).isoformat()

          DATA_FILE.parent.mkdir(exist_ok=True)

          with open(DATA_FILE, "w", encoding="utf-8") as file:
              json.dump(
                  dashboard,
                  file,
                  separators=(",", ":")
              )

          print("Saved updated data/dashboard.json")
          PY

      - name: Save updated dashboard data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/dashboard.json

          if git diff --cached --quiet; then
            echo "No model-data changes to commit."
          else
            git commit -m "Update Kim-Wright and ACM daily model data"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload current dashboard to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy refreshed dashboard
        id: deployment
        uses: actions/deploy-pages@v4
