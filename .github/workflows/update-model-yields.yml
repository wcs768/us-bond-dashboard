name: Update Kim-Wright and ACM model yields

on:
  workflow_dispatch:

  # Run after your UST/TIPS public-data workflow succeeds.
  workflow_run:
    workflows: ["Update public market data"]
    types:
      - completed

  # Backup weekly refresh, every Monday at 23:00 UTC.
  schedule:
    - cron: "0 23 * * 1"

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-model-data:
    # Do not run after a failed UST/TIPS workflow.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download repository files
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install data-processing packages
        run: |
          pip install pandas lxml beautifulsoup4 openpyxl xlrd

      - name: Download Kim-Wright and ACM fitted-yield data
        shell: bash
        run: |
          python - <<'PY'
          import io
          import json
          import re
          import time
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          import pandas as pd

          DATA_FILE = Path("data/dashboard.json")

          # Official Federal Reserve Kim-Wright data tables.
          KW_URL_TEMPLATE = (
              "https://www.federalreserve.gov/data/yield-curve-tables/"
              "feds200533_{page}.html"
          )

          # Official New York Fed ACM downloadable spreadsheet.
          ACM_URLS = [
              "https://www.newyorkfed.org/medialibrary/media/research/data_indicators/ACMTermPremium.xls",
              "https://www.newyorkfed.org/medialibrary/media/research/data_indicators/ACMTermPremium.xlsx",
          ]

          USER_AGENT = "Mozilla/5.0 US-Bond-Yields-Dashboard"

          def download(url, attempts=4):
              last_error = None

              for attempt in range(1, attempts + 1):
                  try:
                      request = urllib.request.Request(
                          url,
                          headers={"User-Agent": USER_AGENT}
                      )

                      with urllib.request.urlopen(request, timeout=120) as response:
                          return response.read()

                  except Exception as error:
                      last_error = error
                      print(f"Attempt {attempt}/{attempts} failed: {url}")
                      print(f"Reason: {error}")

                      if attempt < attempts:
                          time.sleep(10 * attempt)

              raise last_error

          def normalise_column(value):
              return re.sub(r"[^a-z0-9]", "", str(value).lower())

          def as_number(value):
              try:
                  if pd.isna(value):
                      return None

                  text = str(value).strip().replace(",", "")

                  if text in ("", ".", "N/A", "NA", "nan"):
                      return None

                  return float(text)

              except (ValueError, TypeError):
                  return None

          def difference(left, right):
              if left is None or right is None:
                  return None

              return left - right

          def to_iso_date(value, dayfirst=False):
              date = pd.to_datetime(value, errors="coerce", dayfirst=dayfirst)

              if pd.isna(date):
                  return None

              return date.strftime("%Y-%m-%d")

          def read_existing_dashboard():
              if DATA_FILE.exists():
                  with open(DATA_FILE, "r", encoding="utf-8") as file:
                      return json.load(file)

              return {
                  "generated_at_utc": "",
                  "sources": {},
                  "series": {
                      "ust": [],
                      "tips": [],
                      "cds": [],
                      "kw": [],
                      "acm": []
                  }
              }

          def flatten_columns(columns):
              output = []

              for column in columns:
                  if isinstance(column, tuple):
                      output.append(
                          " ".join(
                              str(part)
                              for part in column
                              if str(part).lower() != "nan"
                          ).strip()
                      )
                  else:
                      output.append(str(column).strip())

              return output

          def get_kw_data():
            """
            Download the direct Federal Reserve Kim-Wright CSV.
            """
            kw_csv_url = (
                "https://www.federalreserve.gov/data/"
                "yield-curve-tables/feds200533.csv"
            )

            print(f"Downloading daily Kim-Wright CSV: {kw_csv_url}")

            csv_bytes = download(kw_csv_url)

            # Decode to string to inspect/fix potential encoding issues
            csv_text = csv_bytes.decode('utf-8-sig')
            
            # Some Fed CSVs might have weird line endings or quoting. 
            # Using engine='python' and on_bad_lines='skip' helps with malformed rows.
            try:
                frame = pd.read_csv(
                    io.StringIO(csv_text),
                    sep=',',
                    engine='python',
                    on_bad_lines='skip',
                    skipinitialspace=True
                )
            except Exception as e:
                print(f"Standard CSV read failed, trying alternative parsing: {e}")
                # Fallback: try reading as fixed width or just raw text if it's weird
                raise RuntimeError(f"Failed to parse Kim-Wright CSV: {e}")

            # Clean column names
            frame.columns = [
                str(column).strip()
                for column in frame.columns
            ]

            date_column = next(
                (
                    column for column in frame.columns
                    if normalise_column(column) == "date"
                ),
                None
            )

            required_columns = [
                "THREEFY0200.B",
                "THREEFY0500.B",
                "THREEFY1000.B",
                "THREEFYTP0200.B",
                "THREEFYTP0500.B",
                "THREEFYTP1000.B"
            ]

            if not date_column:
                raise RuntimeError(
                    f"Kim-Wright CSV has no Date column. Found: {list(frame.columns)}"
                )

            missing_columns = [
                column for column in required_columns
                if column not in frame.columns
            ]

            if missing_columns:
                raise RuntimeError(
                    f"Kim-Wright CSV is missing columns: {missing_columns}"
                )

            # Kim-Wright dates are typically DD-MM-YYYY.
            dates = pd.to_datetime(
                frame[date_column].astype(str),
                dayfirst=True,
                format="mixed",
                errors="coerce"
            )

            frame["_date"] = dates.dt.strftime("%Y-%m-%d")

            rows = []

            for _, record in frame.iterrows():
                date = record["_date"]

                if not isinstance(date, str) or not date:
                    continue

                y2 = as_number(record["THREEFY0200.B"])
                y5 = as_number(record["THREEFY0500.B"])
                y10 = as_number(record["THREEFY1000.B"])

                tp2 = as_number(record["THREEFYTP0200.B"])
                tp5 = as_number(record["THREEFYTP0500.B"])
                tp10 = as_number(record["THREEFYTP1000.B"])

                rows.append({
                    "date": date,

                    "y2": y2,
                    "y5": y5,
                    "y10": y10,

                    "tp2": tp2,
                    "tp5": tp5,
                    "tp10": tp10,

                    "er2": y2 - tp2 if y2 is not None and tp2 is not None else None,
                    "er5": y5 - tp5 if y5 is not None and tp5 is not None else None,
                    "er10": y10 - tp10 if y10 is not None and tp10 is not None else None
                })

            # One record per calendar date, in ascending chronological order.
            merged = {
                row["date"]: row
                for row in rows
            }

            result = [
                merged[date]
                for date in sorted(merged)
            ]

            # Prevent a sparse extraction from overwriting the existing full history.
            if len(result) < 5000:
                raise RuntimeError(
                    f"Kim-Wright extraction produced only {len(result)} records. "
                    "Expected thousands of daily records; dashboard data was not replaced."
                )

            latest_date = result[-1]["date"]

            recent_records = [
                row for row in result
                if row["date"] >= latest_date[:4] + "-01-01"
            ]

            print(
                f"Kim-Wright DAILY records extracted: {len(result)}; "
                f"first: {result[0]['date']}; latest: {latest_date}; "
                f"current-year records: {len(recent_records)}"
            )

            return result

          def find_acm_column(columns, tenor):
              """
              New York Fed ACM spreadsheet convention:
              ACMY02, ACMY05 and ACMY10 are model fitted yields.
              """
              normalised = {
                  column: normalise_column(column)
                  for column in columns
              }

              preferred = [
                  f"acmy{tenor:02d}",
                  f"acmy{tenor}",
                  f"fittedyield{tenor}",
                  f"fittedyield{tenor}year",
                  f"yield{tenor}",
                  f"yield{tenor}year"
              ]

              for target in preferred:
                  for original, cleaned in normalised.items():
                      if cleaned == target:
                          return original

              raise RuntimeError(
                  f"Cannot find ACM fitted {tenor}Y yield column. "
                  f"Available columns: {list(columns)}"
              )

          def find_acm_term_premium_column(columns, tenor):
              normalised = {
                  column: normalise_column(column)
                  for column in columns
              }

              preferred = [
                  f"acmtp{tenor:02d}",
                  f"acmtp{tenor}",
                  f"termpremium{tenor}",
                  f"termpremium{tenor}year",
                  f"tp{tenor}",
                  f"tp{tenor}year"
              ]

              for target in preferred:
                  for original, cleaned in normalised.items():
                      if cleaned == target:
                          return original

              raise RuntimeError(
                  f"Cannot find ACM {tenor}Y term-premium column. "
                  f"Available columns: {list(columns)}"
              )

          def get_acm_data():
            """
            Download the official NY Fed ACM workbook and explicitly read the
            'ACM Daily' worksheet.
            """
            acm_url = (
                "https://www.newyorkfed.org/medialibrary/media/"
                "research/data_indicators/ACMTermPremium.xlsx"
            )

            print(f"Downloading ACM workbook: {acm_url}")

            spreadsheet = download(acm_url)

            excel = pd.ExcelFile(
                io.BytesIO(spreadsheet),
                engine="openpyxl"
            )

            print(f"ACM worksheets available: {excel.sheet_names}")

            daily_sheet = next(
                (
                    sheet_name
                    for sheet_name in excel.sheet_names
                    if normalise_column(sheet_name) == "acmdaily"
                ),
                None
            )

            if not daily_sheet:
                raise RuntimeError(
                    "The ACM workbook does not contain an 'ACM Daily' worksheet. "
                    f"Worksheets found: {excel.sheet_names}"
                )

            print(f"Using ACM worksheet: {daily_sheet}")

            # The workbook can contain title rows above the true column headers.
            raw = pd.read_excel(
                excel,
                sheet_name=daily_sheet,
                header=None
            )

            header_row = None

            for row_number in range(min(30, len(raw))):
                candidate_headers = [
                    str(value).strip()
                    for value in raw.iloc[row_number].tolist()
                ]

                cleaned_headers = [
                    normalise_column(value)
                    for value in candidate_headers
                ]

                has_date = any(value == "date" for value in cleaned_headers)

                has_required_yields = all(
                    field in cleaned_headers
                    for field in ["acmy02", "acmy05", "acmy10"]
                )

                has_required_premia = all(
                    field in cleaned_headers
                    for field in ["acmtp02", "acmtp05", "acmtp10"]
                )

                if has_date and has_required_yields and has_required_premia:
                    header_row = row_number
                    break

            if header_row is None:
                raise RuntimeError(
                    "Could not find Date, ACMY02/05/10 and ACMTP02/05/10 "
                    "columns in the ACM Daily worksheet."
                )

            frame = raw.iloc[header_row + 1:].copy()
            frame.columns = [
                str(value).strip()
                for value in raw.iloc[header_row].tolist()
            ]

            frame = frame.dropna(how="all")

            def acm_column(code):
                for column in frame.columns:
                    if normalise_column(column) == code:
                        return column

                raise RuntimeError(
                    f"ACM Daily worksheet does not have column {code}. "
                    f"Columns found: {list(frame.columns)}"
                )

            date_column = acm_column("date")

            y2_column = acm_column("acmy02")
            y5_column = acm_column("acmy05")
            y10_column = acm_column("acmy10")

            tp2_column = acm_column("acmtp02")
            tp5_column = acm_column("acmtp05")
            tp10_column = acm_column("acmtp10")

            rows = []

            for _, record in frame.iterrows():
                date = to_iso_date(record[date_column])

                if not date:
                    continue

                y2 = as_number(record[y2_column])
                y5 = as_number(record[y5_column])
                y10 = as_number(record[y10_column])

                tp2 = as_number(record[tp2_column])
                tp5 = as_number(record[tp5_column])
                tp10 = as_number(record[tp10_column])

                rows.append({
                    "date": date,

                    "y2": y2,
                    "y5": y5,
                    "y10": y10,

                    "tp2": tp2,
                    "tp5": tp5,
                    "tp10": tp10,

                    "er2": y2 - tp2 if y2 is not None and tp2 is not None else None,
                    "er5": y5 - tp5 if y5 is not None and tp5 is not None else None,
                    "er10": y10 - tp10 if y10 is not None and tp10 is not None else None
                })

            merged = {
                row["date"]: row
                for row in rows
            }

            result = [
                merged[date]
                for date in sorted(merged)
            ]
